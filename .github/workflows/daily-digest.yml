name: Daily Global Finance Digest

on:
  schedule:
    # 早上 07:35 (北京时间 UTC+8 -> 对应 UTC 23:35，避开整点高峰)
    - cron: '35 23 * * *'
    # 下午 16:08 (北京时间 UTC+8 -> 对应 UTC 08:08，避开整点拥堵)
    - cron: '8 8 * * *'
  workflow_dispatch: # 支持在 GitHub 网页或 API 手动点击一键测试

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  digest:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 执行抓取、提炼、生成大字版网页并推送到 iPhone Bark
        env:
          TZ: 'Asia/Shanghai'
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER || 'https://api.day.app' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          python digest.py

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
